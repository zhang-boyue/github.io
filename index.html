<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="The personal website of Boyue Zhang.">
  <title>Boyue Zhang</title>
  <style>
    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #252525;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px 24px;
    }
    img {
      display: block;
      width: min(360px, 100%);
      max-height: 70vh;
      max-height: 70dvh;
      height: auto;
      object-fit: contain;
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 30px);
      font-weight: 500;
      letter-spacing: 0.015em;
      line-height: 1.25;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <img src="portrait.jpg" alt="Portrait of Boyue Zhang" width="1100" height="1650">
    <h1>Boyue Zhang</h1>
  </main>
</body>
</html>
